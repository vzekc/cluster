apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: discourse-tls
  namespace: prod
spec:
  secretName: discourse-tls
  issuerRef:
    name: letsencrypt-prod-dns01-hetzner
    kind: ClusterIssuer
  commonName: discourse.k8s.classic-computing.de
  # Both names go on the cert from day one. DNS-01 validates the bare
  # hostname while its A record still points at the old VM, so the
  # cluster serves a valid cert for it the moment DNS is flipped.
  dnsNames:
    - discourse.k8s.classic-computing.de
    - discourse.classic-computing.de
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  duration: 2160h
  renewBefore: 720h
