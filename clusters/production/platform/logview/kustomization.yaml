apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability

resources:
  - sealed-secret.yaml
  - deployment.yaml
  - ingress.yaml

# The page and its source list are the configuration. A hash in the name is
# what makes a commit to either of them roll the pod that serves it.
configMapGenerator:
  - name: logview-app
    files:
      - index.html
      - sources.json
  - name: logview-nginx
    files:
      - nginx.conf
