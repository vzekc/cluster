# Serves the page and proxies its questions to Loki, which is on the service
# network and answers no one from outside. The page therefore holds no
# credentials of its own: whoever got past the ingress is already through.

worker_processes 1;
error_log  /dev/stderr warn;
pid        /tmp/nginx.pid;

events { worker_connections 256; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    off;

    # Unprivileged nginx writes nothing under /var.
    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    sendfile on;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8080;
        root   /srv;
        index  index.html;

        location = /healthz { return 200 "ok\n"; }

        # A tail is a websocket held open for as long as somebody is watching,
        # so it is not allowed to time out the way a request would.
        location /loki/ {
            proxy_pass http://loki.observability.svc.cluster.local:3100;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $host;
            proxy_buffering off;
            proxy_read_timeout  1h;
            proxy_send_timeout  1h;
        }

        location / {
            try_files $uri $uri/ =404;
            add_header Cache-Control "no-cache";
        }
    }
}
