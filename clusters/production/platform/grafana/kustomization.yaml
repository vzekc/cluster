apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - sealed-secret.yaml
  - helmrelease.yaml
  - ingress.yaml
  - certificate.yaml

# Dashboards provisioned from files here, mounted into Grafana by the
# HelmRelease under the fixed name it refers to them by.
configMapGenerator:
  - name: grafana-dashboards-provisioned
    namespace: observability
    files:
      - dashboards/fotofix-access.json
    options:
      disableNameSuffixHash: true
