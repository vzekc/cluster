# Loki holds the cluster's logs, and the logs of machines outside it that ship
# here. Single-binary mode on one Hetzner volume: the write rate is a handful of
# lines a second, which one process serves without the read/write/backend split
# the chart offers for larger installs.
#
# Retention is 30 days. Anything older is compacted away, which is what keeps a
# fixed-size volume a fixed-size volume.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: observability
spec:
  interval: 15m
  releaseName: loki
  chart:
    spec:
      chart: loki
      version: "7.x"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  values:
    deploymentMode: SingleBinary

    loki:
      # One tenant. Callers are separated by labels, and the write path is
      # reached over an authenticated ingress rather than by tenant header.
      auth_enabled: false
      commonConfig:
        replication_factor: 1
      storage:
        type: filesystem
      schemaConfig:
        configs:
          - from: "2024-04-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: index_
              period: 24h
      limits_config:
        retention_period: 720h
      compactor:
        retention_enabled: true
        delete_request_store: filesystem

    singleBinary:
      replicas: 1
      persistence:
        enabled: true
        storageClass: hcloud-volumes
        size: 50Gi

    # The scaled-out roles, the caches and the canary belong to the larger
    # deployment modes.
    read:
      replicas: 0
    write:
      replicas: 0
    backend:
      replicas: 0
    gateway:
      enabled: false
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false
    lokiCanary:
      enabled: false
    test:
      enabled: false
